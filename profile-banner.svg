<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1B1035"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#6D42E0"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2A65A"/>
      <stop offset="100%" stop-color="#F6C177"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Grid texture, subtle -->
  <g opacity="0.06" stroke="#E2E8F0" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Signature: stacked architecture layers, right side -->
  <g transform="translate(830, 90)">
    <rect x="0" y="0" width="290" height="34" rx="6" fill="url(#layer1)"/>
    <text x="145" y="22" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#0B1120" font-weight="700" text-anchor="middle">Interface</text>

    <rect x="30" y="52" width="260" height="34" rx="6" fill="url(#layer2)"/>
    <text x="160" y="74" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#0B1120" font-weight="700" text-anchor="middle">Repository</text>

    <rect x="60" y="104" width="230" height="34" rx="6" fill="url(#layer3)"/>
    <text x="175" y="126" font-family="JetBrains Mono, Fira Code, monospace" font-size="13" fill="#0B1120" font-weight="700" text-anchor="middle">Data</text>

    <!-- connecting ticks -->
    <line x1="145" y1="34" x2="160" y2="52" stroke="#4B5563" stroke-width="2"/>
    <line x1="160" y1="86" x2="175" y2="104" stroke="#4B5563" stroke-width="2"/>
  </g>

  <!-- Name and tagline -->
  <text x="60" y="120" font-family="JetBrains Mono, Fira Code, monospace" font-size="42" font-weight="700" fill="#E2E8F0">Luiz Célio Gomes Filho</text>
  <text x="60" y="156" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#94A3B8">Backend Developer · C# · .NET · Native AOT</text>

  <!-- Small tagline, signature line -->
  <text x="60" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#64748B">Building solid layers, one commit at a time.</text>

  <!-- Bottom accent rule -->
  <rect x="60" y="230" width="120" height="4" rx="2" fill="url(#layer1)"/>
</svg>
